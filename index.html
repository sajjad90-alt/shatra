document.querySelectorAll("[data-i]").forEach(e => e.outerHTML = ic(e.dataset.i));
const sv = () => { try { localStorage.setItem("cart", JSON.stringify(S.cart)); } catch (e) {} };
const cn = () => { $("#cn").textContent = S.cart.reduce((a, x) => a + x.q, 0) || ""; };
const shrink = f => new Promise(r => { if (!f) return r(""); const i = new Image(); i.onload = () => { const k = Math.min(1, 240 / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = i.width * k; c.height = i.height * k; c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); r(c.toDataURL("image/jpeg", .6)); }; i.onerror = () => r(""); i.src = URL.createObjectURL(f); });

async function load() {
  try {
    const a = await getDocs(query(collection(db, "pharmacies"), where("status", "==", "approved")));
    S.ph = a.docs.map(d => ({id: d.id, ...d.data()}));
    const b = await getDocs(collection(db, "drugs"));
    S.dr = b.docs.map(d => ({id: d.id, ...d.data()}));
    S.loaded = true;
  } catch (e) { S.loaded = true; err(e); }
}

const card = (p, i) => `<div class="${i ? "s" : "c"}"><b class="k" onclick="A.pg('${E(p.id)}')">${E(p.name)} ›</b><div class="m">${ic("pin")}${E(p.address)}</div>
<div class="b"><a href="tel:${tel(p.phone)}">${ic("phone")}اتصال</a><a href="${wa(p.phone)}">${ic("chat")}واتساب</a></div></div>`;

const drow = d => `${d.img ? `<img class="di" src="${d.img}">` : ""}<b>${E(d.name)}</b><span class="pr">${E(d.price)} د.ع</span><div style="clear:both"></div><button class="o w" style="margin-top:8px" onclick="A.cart('${E(d.id)}',this)">${ic("cart")}أضف للسلة</button>`;

const nz = s => String(s || "").toLowerCase().replace(/[\u064B-\u065F\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/\s+/g, " ").trim();
const lev = (a, b) => { const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => { const r = Array(n + 1).fill(0); r[0] = i; return r; }); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; };
const dist = (name, q) => { const n = nz(name); if (n.includes(q)) return 0; const t = q.length >= 6 ? 2 : q.length >= 4 ? 1 : 0; let best = 9; for (const w of n.split(" ")) best = Math.min(best, lev(q, w), lev(q, w.slice(0, q.length))); return best <= t ? best : 9; };
const popular = () => { const ok = new Set(S.ph.map(p => p.id)), m = {}; S.dr.forEach(d => { if (!ok.has(d.pharmacyId) || d.available === false) return; const k = nz(d.name); (m[k] = m[k] || {n: d.name, s: new Set()}).s.add(d.pharmacyId); }); return Object.values(m).sort((a, b) => b.s.size - a.s.size).slice(0, 5); };
const dres = (d, p, best) => `<div class="c">${d.img ? `<img class="di" src="${d.img}">` : ""}<div class="r"><span><b>${E(d.name)}</b>${best ? '<span class="bg">الأرخص</span>' : ""}</span><span class="pr">${E(d.price)} د.ع</span></div><div class="r2"><span class="k" onclick="A.pg('${E(p.id)}')"><span class="av">${E(p.name.trim().charAt(0))}</span>${E(p.name)} ›</span><span class="ia"><a href="tel:${tel(p.phone)}">${ic("phone")}</a><a href="${wa(p.phone)}">${ic("chat")}</a><button onclick="A.cart('${E(d.id)}',this)">${ic("cart")}</button></span></div></div>`;

function res() {
  if (!S.loaded) return '<p class="m">جارٍ التحميل...</p>';
  const q = nz(S.q), pm = Object.fromEntries(S.ph.map(p => [p.id, p]));
  if (S.mode === "ph") {
    const l = S.ph.filter(p => !q || dist(p.name, q) < 9);
    return l.map(p => card(p)).join("") || '<p class="m">لا توجد صيدليات مطابقة</p>';
  }
  if (!q) {
    S.pop = popular();
    return (S.pop.length ? "<h3>أدوية شائعة</h3>" + S.pop.map((x, i) => `<div class="pop k t${i % 4}" onclick="A.pick('pop',${i})"><span class="ib">${ic("pill")}</span><b>${E(x.n)}</b><span class="bq">${ic("store")}متوفر في ${x.s.size} صيدلية</span><span class="cv">‹</span></div>`).join("") : '<p class="m">ستظهر هنا الأدوية الشائعة عندما تضيف الصيدليات أدويتها.</p>') ;
  }
  const l = S.dr.filter(d => pm[d.pharmacyId] && d.available !== false).map(d => ({d, k: dist(d.name, q)})).filter(x => x.k < 9);
  if (!l.length) return `<p class="m">لم نجد «${E(S.q)}». جرّب كلمة أخرى أو اكتب جزءاً من الاسم.</p>`;
  l.sort((a, b) => a.k - b.k);
  const names = []; l.forEach(x => { if (!names.some(n => nz(n) === nz(x.d.name))) names.push(x.d.name); });
  S.sg = names;
  let hint = "";
  if (l[0].k > 0) hint += `<div class="c">${ic("spark")}هل تقصد: <b class="k" onclick="A.pick('sg',0)">${E(names[0])}</b>؟</div>`;
  if (names.length > 1) hint += "<div>" + names.slice(0, 5).map((n, i) => `<span class="ch k" onclick="A.pick('sg',${i})">${E(n)}</span>`).join("") + "</div>";
  const g = {}; l.forEach(x => (g[nz(x.d.name)] = g[nz(x.d.name)] || []).push(x.d.price));
  l.sort((a, b) => a.d.price - b.d.price);
  return hint + `<p class="m">${l.length} نتيجة، مرتبة من الأرخص</p>` + l.map(x => { const arr = g[nz(x.d.name)]; return dres(x.d, pm[x.d.pharmacyId], arr.length > 1 && x.d.price === Math.min(...arr)); }).join("");
}

const vSearch = () => S.pg ? vPh() : `<div class="tg"><button class="${S.mode === "drug" ? "on" : ""}" onclick="A.mode('drug')">${ic("pill")}أدوية</button><button class="${S.mode === "ph" ? "on" : ""}" onclick="A.mode('ph')">الصيدليات</button></div>
<div class="sb"><input id="q" placeholder="${S.mode === "drug" ? "ابحث عن دواء أو صيدلية..." : "ابحث عن صيدلية..."}" value="${E(S.q)}" oninput="A.q(this.value)"><span class="sbi">${ic("search")}</span></div><div id="res">${res()}</div>`;

const pl = () => { const q = S.pq.trim().toLowerCase(); return S.dr.filter(d => d.pharmacyId === S.pg && d.available !== false && d.name.toLowerCase().includes(q)).map(d => `<div class="c">${drow(d)}</div>`).join("") || '<p class="m">لا توجد أدوية</p>'; };
const vPh = () => { const p = S.ph.find(x => x.id === S.pg); if (!p) { S.pg = null; return vSearch(); } return `<button class="o" onclick="A.pg(null)">→ رجوع</button><div style="height:10px"></div>${card(p)}<input placeholder="ابحث في أدوية هذه الصيدلية..." value="${E(S.pq)}" oninput="A.pq(this.value)"><div id="pl">${pl()}</div>`; };

const outBtn = '<button class="o w" onclick="A.out()">تسجيل الخروج</button>';

function vOwner() {
  const u = S.user;
  if (!u || isAdmin()) {
    if (S.ov === "reg") return `<h3>طلب إضافة صيدلية</h3><p class="m">بعد إرسال الطلب تراجعه الإدارة وتقبله أو ترفضه.</p>
<input id="n" placeholder="اسم الصيدلية"><input id="a" placeholder="العنوان (مثال: الشطرة - السوق)"><input id="p" type="tel" placeholder="رقم الهاتف / واتساب">
<input id="e" type="email" placeholder="الإيميل"><input id="w" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)">
<button class="w" onclick="A.reg()">إرسال الطلب</button><button class="o w" style="margin-top:8px" onclick="A.ov('login')">لدي حساب</button>`;
    return `<button class="o w" style="margin-bottom:10px" onclick="A.ov('reg')">${ic("plus")}إضافة صيدلية</button><input id="e" type="email" placeholder="الإيميل"><input id="w" type="password" placeholder="كلمة المرور">
<button class="w" onclick="A.login()">دخول</button>`;
  }
  if (!S.me) {
    if (!S.meDone) return '<p class="m">جارٍ التحميل...</p>' + outBtn;
    if (S.meErr) return `<p class="m">تعذر تحميل بيانات الصيدلية (${E(S.meErr)}).</p><button class="w" onclick="A.again()">إعادة المحاولة</button><div style="height:8px"></div>` + outBtn;
    return `<h3>إكمال طلب الصيدلية</h3><p class="m">لا يوجد طلب صيدلية مرتبط بهذا الحساب (${E(u.email)}). أدخل بيانات الصيدلية لإرسال الطلب للإدارة.</p><input id="n" placeholder="اسم الصيدلية"><input id="a" placeholder="العنوان"><input id="p" type="tel" placeholder="رقم الهاتف / واتساب"><button class="w" onclick="A.fix()">إرسال الطلب</button><div style="height:8px"></div>` + outBtn;
  }
  const m = S.me, head = `<div class="c"><b>${E(m.name)}</b><div class="m">${E(u.email)}</div></div>`;
  if (m.status === "pending") return head + '<p class="m">طلبك قيد المراجعة من الإدارة.</p>' + outBtn;
  if (m.status === "rejected") return head + '<p class="m">تم رفض الطلب. تواصل مع الإدارة.</p>' + outBtn;
  const mine = S.dr.filter(d => d.pharmacyId === u.uid);
  return head + `<h3>إضافة دواء</h3><input id="dn" placeholder="اسم الدواء"><input id="dp" type="number" inputmode="numeric" placeholder="السعر بالدينار"><input id="di" type="file" accept="image/*">
<button class="w" onclick="A.add()">إضافة</button><h3>أدويتي (${mine.length})</h3>` +
    (mine.map(d => `<div class="c">${d.img ? `<img class="di" src="${d.img}">` : ""}<b>${E(d.name)}</b><span class="pr">${E(d.price)} د.ع</span>
<div class="m">${d.available === false ? "غير متوفر" : "متوفر"}</div>
<div class="b"><button class="o" onclick="A.price('${E(d.id)}')">السعر</button><button class="o" onclick="A.tog('${E(d.id)}',${d.available === false})">${d.available === false ? "توفّر" : "نفد"}</button><button class="d" onclick="A.del('${E(d.id)}')">حذف</button></div></div>`).join("") || '<p class="m">لم تضف أي دواء بعد</p>') + outBtn;
}

function vAdmin() {
  if (!isAdmin()) return `<h3>دخول الإدارة</h3><input id="k" type="password" placeholder="مفتاح الإدارة"><button class="w" onclick="A.adm()">دخول</button>`;
  const pe = S.all.filter(x => x.status === "pending"), ap = S.all.filter(x => x.status === "approved");
  const row = (p, btns) => `<div class="c"><b>${E(p.name)}</b><div class="m">${ic("pin")}${E(p.address)} · ${ic("phone")}${E(p.phone)}</div><div class="m">${E(p.email)}</div><div class="b">${btns}</div></div>`;
  return `<h3>طلبات الانضمام (${pe.length})</h3>` +
    (pe.map(p => row(p, `<button onclick="A.set('${E(p.id)}','approved')">قبول</button><button class="d" onclick="A.set('${E(p.id)}','rejected')">رفض</button>`)).join("") || '<p class="m">لا توجد طلبات جديدة</p>') +
    `<h3>الصيدليات المعتمدة (${ap.length})</h3>` +
    (ap.map(p => row(p, `<button class="d" onclick="A.rm('${E(p.id)}')">حذف الصيدلية</button>`)).join("") || '<p class="m">لا توجد صيدليات بعد</p>') + outBtn;
}

function vCart() {
  if (!S.cart.length) return '<p class="m">السلة فارغة. أضف أدوية من تبويب البحث.</p>';
  const g = {}; S.cart.forEach(x => (g[x.ph] = g[x.ph] || []).push(x));
  return Object.entries(g).map(([id, l]) => {
    const p = S.ph.find(x => x.id === id), t = l.reduce((a, x) => a + x.price * x.q, 0);
    return `<div class="c"><b>${E(p ? p.name : "صيدلية")}</b>` + l.map(x => `<div class="s"><b>${E(x.name)}</b><span class="pr">${x.price * x.q} د.ع</span><div class="b"><button class="o" onclick="A.qty('${E(x.id)}',-1)">−</button><span class="m" style="align-self:center">${x.q}</span><button class="o" onclick="A.qty('${E(x.id)}',1)">+</button></div></div>`).join("") + `<h3>المجموع: ${t} د.ع</h3>` + (p ? `<button class="w" onclick="A.send('${E(id)}')">${ic("send")}أرسل الطلب عبر واتساب</button>` : "") + `</div>`;
  }).join("") + '<button class="d w" onclick="A.clr()">تفريغ السلة</button>';
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.v));
  document.body.dataset.v = S.v; const n = S.all.filter(x => x.status === "pending").length;
  $("#bd").textContent = isAdmin() && n ? n : "";
  cn(); $("#na").style.display = S.adm || isAdmin() ? "" : "none";
  $("#app").innerHTML = ({search: vSearch, cart: vCart, owner: vOwner, admin: vAdmin})[S.v]();
}

window.A = {
  v(x) { S.v = x; S.pg = null; if (x === "owner") { if (++S.tp >= 5) S.adm = 1; } else S.tp = 0; render(); if (x === "search") load().then(() => $("#res") && ($("#res").innerHTML = res())); },
  mode(m) { S.mode = m; S.q = ""; render(); },
  pick(t, i) { S.mode = "drug"; S.q = t === "pop" ? S.pop[i].n : S.sg[i]; render(); },
  pg(id) { S.pg = id; S.pq = ""; render(); },
  pq(v) { S.pq = v; $("#pl").innerHTML = pl(); },
  cart(id, b) { const d = S.dr.find(x => x.id === id); if (!d) return; const c = S.cart.find(x => x.id === id); c ? c.q++ : S.cart.push({id, name: d.name, price: d.price, ph: d.pharmacyId, q: 1}); sv(); cn(); if (b) { b.style.background = "var(--g)"; b.style.color = "var(--on)"; } },
  qty(id, n) { const c = S.cart.find(x => x.id === id); c.q += n; if (c.q < 1) S.cart = S.cart.filter(x => x !== c); sv(); render(); },
  async clr() { if (await ask("تأكيد تفريغ السلة؟", "تفريغ")) { S.cart = []; sv(); render(); } },
  send(id) { const p = S.ph.find(x => x.id === id), l = S.cart.filter(x => x.ph === id); let t = 0; const m = "السلام عليكم، أريد طلب:\n" + l.map(x => { t += x.price * x.q; return `- ${x.name} × ${x.q} = ${x.price * x.q} د.ع`; }).join("\n") + `\nالمجموع: ${t} د.ع`; window.open(wa(p.phone) + "?text=" + encodeURIComponent(m), "_blank"); },
  q(v) { S.q = v; $("#res").innerHTML = res(); },
  ov(x) { S.ov = x; render(); },
  async reg() {
    const n = val("n"), a = val("a"), p = val("p"), e = val("e"), w = $("#w").value;
    if (!n || !a || !p || !e || w.length < 6) return say("أكمل كل الحقول (كلمة المرور 6 أحرف على الأقل)");
    try {
      const c = await createUserWithEmailAndPassword(auth, e, w);
      await setDoc(doc(db, "pharmacies", c.user.uid), {name: n, address: a, phone: p, email: e, status: "pending", createdAt: serverTimestamp()});
      await signOut(auth);
      S.ov = "login"; render();
      say("تم إرسال طلبك للإدارة. سجّل الدخول لاحقاً لمعرفة النتيجة.");
    } catch (x) { err(x); }
  },
  async again() { S.meDone = false; S.meErr = ""; render(); try { const d = await getDoc(doc(db, "pharmacies", S.user.uid)); S.me = d.exists() ? {id: d.id, ...d.data()} : null; } catch (e) { S.meErr = e.code || "error"; } S.meDone = true; render(); },
  async fix() { const n = val("n"), a = val("a"), p = val("p"); if (!n || !a || !p) return say("أكمل كل الحقول"); try { await setDoc(doc(db, "pharmacies", S.user.uid), {name: n, address: a, phone: p, email: S.user.email, status: "pending", createdAt: serverTimestamp()}); await A.again(); say("تم إرسال طلبك للإدارة."); } catch (x) { err(x); } },
  async login() { try { await signInWithEmailAndPassword(auth, val("e"), $("#w").value); } catch (x) { err(x); } },
  async adm() { try { await signInWithEmailAndPassword(auth, ADMIN, $("#k").value); } catch (x) { say((x.code === "auth/invalid-credential" || x.code === "auth/wrong-password") ? "مفتاح الإدارة غير صحيح، أو لم يُنشأ حساب admin@shatra.app في Firebase" : "حدث خطأ: " + x.code); } },
  async out() { await signOut(auth); },
  async add() {
    const n = val("dn"), p = Number(val("dp"));
    if (!n || !(p > 0)) return say("اكتب اسم الدواء وسعراً صحيحاً");
    try { const img = await shrink($("#di").files[0]); await addDoc(collection(db, "drugs"), {pharmacyId: S.user.uid, name: n, price: p, available: true, img}); await load(); render(); } catch (x) { err(x); }
  },
  async price(id) {
    const p = Number(await askNum("السعر الجديد بالدينار:"));
    if (!(p > 0)) return;
    try { await updateDoc(doc(db, "drugs", id), {price: p}); await load(); render(); } catch (x) { err(x); }
  },
  async tog(id, v) { try { await updateDoc(doc(db, "drugs", id), {available: v}); await load(); render(); } catch (x) { err(x); } },
  async del(id) { if (!await ask("تأكيد حذف الدواء؟", "حذف")) return; try { await deleteDoc(doc(db, "drugs", id)); await load(); render(); } catch (x) { err(x); } },
  async set(id, s) { try { await updateDoc(doc(db, "pharmacies", id), {status: s}); await load(); } catch (x) { err(x); } },
  async rm(id) { if (!await ask("تأكيد حذف الصيدلية نهائياً؟", "حذف")) return; try { await deleteDoc(doc(db, "pharmacies", id)); await load(); } catch (x) { err(x); } }
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
onAuthStateChanged(auth, async u => {
  S.user = u; S.me = null; S.all = []; S.meDone = !u; S.meErr = "";
  if (unsub) { unsub(); unsub = null; }
  if (u && u.email === ADMIN) {
    unsub = onSnapshot(collection(db, "pharmacies"), s => { S.all = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }, err);
  } else if (u) {
    try { const d = await getDoc(doc(db, "pharmacies", u.uid)); S.me = d.exists() ? {id: d.id, ...d.data()} : null; } catch (e) { S.meErr = e.code || "error"; }
    S.meDone = true;
  }
  render();
});
load().then(render);
render();
</script>
</body>
</html>
